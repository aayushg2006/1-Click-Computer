spring.config.import=optional:file:.env[.properties]
spring.application.name=backend-core

# ===============================
# SERVER PORT
# ===============================
server.port=${SERVER_PORT:8080}

# ===============================
# POSTGRESQL DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_HOST_PORT:5433}/${POSTGRES_DB:1clickdb}
spring.datasource.username=${POSTGRES_USER:1click}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.postgresql.Driver}

# ===============================
# REDIS / RABBITMQ CONFIGURATION
# ===============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_HOST_PORT:6379}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_HOST_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER:1click}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS:}

# ===============================
# HIBERNATE / JPA CONFIGURATION
# ===============================
# Automatically creates and updates database tables based on your Java Entities
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Show SQL queries in the console (great for learning how Hibernate works)
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}

# Specify the exact PostgreSQL dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

evolution.api.base-url=${EVOLUTION_API_URL:http://localhost:8082}
evolution.api.instance=${EVOLUTION_API_INSTANCE:oneclick_instance}
evolution.api.key=${EVOLUTION_API_KEY:}

storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
storage.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
storage.minio.secret-key=${MINIO_SECRET_KEY:minioadmin123}
storage.minio.bucket=${MINIO_BUCKET:oneclick}
storage.minio.public-base-url=${MINIO_PUBLIC_BASE_URL:http://localhost:9000}
storage.minio.enabled=${MINIO_ENABLED:true}

app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:true}
app.bootstrap.admin-username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:admin123}
app.bootstrap.technician-username=${BOOTSTRAP_TECHNICIAN_USERNAME:tech1}
app.bootstrap.technician-password=${BOOTSTRAP_TECHNICIAN_PASSWORD:tech123}

payments.upi.vpa=${UPI_VPA:}
payments.upi.payee-name=${UPI_PAYEE_NAME:1 Click Computer}

ocr.ollama.base-url=${OCR_OLLAMA_BASE_URL:http://localhost:11434}
ocr.ollama.model=${OCR_OLLAMA_MODEL:gemma3}
customer.access.token.ttl-seconds=${CUSTOMER_ACCESS_TOKEN_TTL_SECONDS:3600}

spring.jpa.open-in-view=false
server.error.include-message=always
