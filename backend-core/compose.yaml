services:
  postgres:
    image: "${POSTGRES_IMAGE:-postgres:latest}"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-1clickdb}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}"
      POSTGRES_USER: "${POSTGRES_USER:-1click}"
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"

  rabbitmq:
    image: "${RABBITMQ_IMAGE:-rabbitmq:3-management}"
    environment:
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-}"
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-1click}"
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

  redis:
    image: "${REDIS_IMAGE:-redis:latest}"
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  minio:
    image: "minio/minio:latest"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin123}"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  evolution-api:
    image: atendai/evolution-api:latest
    container_name: evolution_api
    restart: always
    ports:
      - "8082:8082"
    depends_on:
      - postgres
      - redis
      - minio
    environment:
      SERVER_URL: "http://localhost:8082"
      AUTH_TYPE: "apikey"
      AUTH_API_KEY: "${EVOLUTION_API_KEY}"
      DATABASE_PROVIDER: "postgresql"
      DATABASE_CONNECTION_URI: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://redis:6379/1"
      WA_WEB_VERSION: "2.3000.1015901307"

volumes:
  minio-data:
